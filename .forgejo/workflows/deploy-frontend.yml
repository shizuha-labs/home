# Shizuha Origin CI/CD — MULTI-ARCH build + deploy shizuha-home-FRONTEND.
# shizuha-home is frontend-only (no backend image) and root-mounted at /, so the
# default VITE base path is correct and no VITE_BASE_PATH build-arg is needed.
#
# BUILD CONTEXT IS THE MONOREPO, NOT THIS REPO: Dockerfile.prod copies
# packages/shizuha-ui and packages/shizuha-chat from the shizuha-stack monorepo
# root (they are tracked there, not published standalone), so the clone step
# assembles monorepo + this repo checked out at the triggering SHA. This mirrors
# deploy/k3s/scripts/build-multiarch.sh (FRONTEND_PATH=shizuha-home, root
# Dockerfile.prod) — the manual path used for the 2026-07-02 cache-control fix
# because home previously had NO Origin CI at all.
name: deploy-shizuha-home-frontend
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    paths:
      - .forgejo/workflows/deploy-frontend.yml
      - .forgejo/scripts/test-deploy-frontend-kaniko-retry.py
      - frontend/**
concurrency:
  group: deploy-shizuha-home-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      # npm/cli #8974: npm bundled with Node 22/24 can abort `npm ci` with
      # "Exit handler never called"; production already builds on Node 20.
      image: node:20-bookworm
    steps:
      - name: Checkout exact Home revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Lint and route privacy guards
        shell: bash
        run: |
          set -euo pipefail
          # package-lock.json records the developer-facing cache host. Replace
          # it with the runner-local registry so CI never depends on Tailscale.
          cd "$GITHUB_WORKSPACE/frontend"
          # The production build consumes private monorepo package sources;
          # pull-request tokens are intentionally scoped to this repository.
          # Keep this premerge gate repo-local. The push-only deploy job below
          # assembles the monorepo before building the production image.
          npm ci --ignore-scripts --replace-registry-host=always --no-audit --no-fund
          npm run lint
          node scripts/booksCompliance.guardrail.test.mjs
          node scripts/nginxResearchProxy.guardrail.test.mjs
          # Public pages must boot with no JWT. 5d91610 shipped a split-on-null
          # crash because vitest only fed fake JWTs and deploy did not wait for
          # the test job — this guardrail is in quality so it blocks the roll.
          node scripts/loggedOutAuth.guardrail.test.mjs

  # PLAT-6170: wire the frontend vitest regression suite into a CI gate so
  # component tests (e.g. the degraded-vs-empty command-center task-status
  # cases) actually run at PR head instead of existing as an unenforced file.
  # The ubuntu-latest runner image ships python but not node, and its SA
  # cannot read the forgejo-token secret nor clone a sibling repo with the
  # workflow token — so, exactly like the kaniko build below, the suite runs
  # in a k8s Job whose initContainer mounts forgejo-token via secretKeyRef
  # and assembles the monorepo + home at the pushed SHA.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          KUBECTL_ARCH=$(uname -m); case "$KUBECTL_ARCH" in x86_64) KUBECTL_ARCH=amd64;; aarch64) KUBECTL_ARCH=arm64;; esac
          curl -fsSL -o kubectl "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${KUBECTL_ARCH}"
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Run frontend vitest suite in build Job
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          JOB="ci-test-home-frontend-${SHORT}"
          kubectl delete job "${JOB}" -n build --ignore-not-found
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${JOB}
            namespace: build
            labels: { app: ci-test, service: home-frontend, shizuha.io/ci-gate: PLAT-6170 }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: amd64 }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                  # amd64 kaniko on i9-ws times out pushing to registry ClusterIP;
                  # s1 overlay works and carries operator=unschedulable. CI tolerates
                  # the operator-hold taint instead of removing it.
                  - { key: operator, operator: Equal, value: unschedulable, effect: NoSchedule }
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                        # i9-ws overlay to ns registry is i/o timeout. Keep excluded until
                        # ClusterIP/FORWARD on i9-ws is actually fixed.
                        - { key: kubernetes.io/hostname, operator: NotIn, values: [i9-ws] }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        # Monorepo root for packages/ (shallow; submodule pointers only)
                        git clone --depth=1 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/shizuha-stack.git /workspace/src
                        # Replace the shizuha-home submodule pointer with THIS repo at the pushed SHA
                        rm -rf /workspace/src/shizuha-home
                        git clone --depth=50 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/home.git /workspace/src/shizuha-home
                        cd /workspace/src/shizuha-home
                        if ! git checkout --detach ${{ github.sha }}; then
                          git fetch --depth=1 origin ${{ github.sha }}
                          git checkout --detach ${{ github.sha }}
                        fi
                        test "\$(git rev-parse HEAD)" = "${{ github.sha }}"
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: test
                    image: node:20-slim
                    workingDir: /workspace/src/shizuha-home/frontend
                    command: ["/bin/bash","-c"]
                    args:
                      - |
                        set -euo pipefail
                        # Dockerfile.prod installs from package.json only: the
                        # tracked lockfile's file:../../packages deps trip npm's
                        # "Cannot read properties of undefined (reading
                        # 'extraneous')" bug outside the monorepo root.
                        rm -f package-lock.json
                        npm install --ignore-scripts --fund=false --audit=false
                        SHIZUHA_PACKAGES_DIR=/workspace/src/packages npm test
                    env:
                      - name: NPM_CONFIG_REGISTRY
                        value: http://npm-cache.registry.svc.cluster.local:4873/
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          for POLL in $(seq 1 240); do
            if kubectl get "job/${JOB}" -n build -o jsonpath='{.status.succeeded}' | grep -q '[1-9]'; then
              echo "frontend vitest suite passed"
              exit 0
            fi
            if kubectl get "job/${JOB}" -n build -o jsonpath='{.status.failed}' | grep -q '[1-9]'; then
              echo "::error::frontend vitest suite failed"
              kubectl logs -n build "job/${JOB}" --all-containers --tail=200 || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::frontend vitest suite timed out after 1200s"
          kubectl logs -n build "job/${JOB}" --all-containers --tail=200 || true
          exit 1

  build-and-deploy:
    # PLAT-6170: vitest must block the roll. Quality-only `needs` let 5d91610
    # ship a logged-out TypeError while the test job was still running (and
    # that suite never called userFromAccessToken(null) anyway).
    needs: [quality, test]
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision for monotonic release guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          KUBECTL_ARCH=$(uname -m); case "$KUBECTL_ARCH" in x86_64) KUBECTL_ARCH=amd64;; aarch64) KUBECTL_ARCH=arm64;; esac
          curl -fsSL -o kubectl "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${KUBECTL_ARCH}"
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Multi-arch build + deploy + verify (frontend)
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          FTAG="home-frontend-${SHORT}"
          REG="registry.registry.svc.cluster.local:5000"
          echo "Multi-arch build shizuha-home-frontend:${FTAG} (amd64 + arm64)"
          PREV_ROLL_IMAGE="$(kubectl -n shizuha get deploy shizuha-home-frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          # The live deployment references the registry via the node-local localhost:30500
          # host, which is NOT reachable from inside the kaniko build pod (its own loopback).
          # Normalize to the in-cluster registry service so kaniko can pull the previous
          # image to carry forward the hashed CSS/JS assets.
          PREV_FRONTEND_IMAGE="${PREV_ROLL_IMAGE//localhost:30500/${REG}}"
          echo "Carry forward hashed assets from ${PREV_FRONTEND_IMAGE}"

          render_build_job() {  # $1=arch $2=attempt $3=cache-enabled
            local ARCH="$1"
            local ATTEMPT="$2"
            local CACHE_ENABLED="$3"
            cat <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-build-home-frontend-${SHORT}-${ARCH}-try${ATTEMPT}
            namespace: build
            labels:
              app: ci-build
              service: home-frontend
              attempt: "${ATTEMPT}"
              cache-enabled: "${CACHE_ENABLED}"
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: ${ARCH} }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                  # amd64 kaniko on i9-ws times out pushing to registry ClusterIP;
                  # s1 overlay works and carries operator=unschedulable. CI tolerates
                  # the operator-hold taint instead of removing it.
                  - { key: operator, operator: Equal, value: unschedulable, effect: NoSchedule }
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                        # i9-ws overlay to ns registry is i/o timeout. Keep excluded until
                        # ClusterIP/FORWARD on i9-ws is actually fixed.
                        - { key: kubernetes.io/hostname, operator: NotIn, values: [i9-ws] }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        # Monorepo root for packages/ (shallow; submodule pointers only)
                        git clone --depth=1 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/shizuha-stack.git /workspace/src
                        # Replace the shizuha-home submodule pointer with THIS repo at the pushed SHA
                        rm -rf /workspace/src/shizuha-home
                        git clone --depth=50 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/home.git /workspace/src/shizuha-home
                        cd /workspace/src/shizuha-home
                        if ! git checkout --detach ${{ github.sha }}; then
                          git fetch --depth=1 origin ${{ github.sha }}
                          git checkout --detach ${{ github.sha }}
                        fi
                        test "\$(git rev-parse HEAD)" = "${{ github.sha }}"
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: kaniko
                    image: gcr.io/kaniko-project/executor:v1.23.2
                    args:
                      - --context=dir:///workspace/src
                      - --dockerfile=/workspace/src/shizuha-home/Dockerfile.prod
                      - --destination=${REG}/shizuha-home-frontend:${FTAG}-${ARCH}
                      - --cleanup
                      - --insecure
                      - --skip-tls-verify
                      - --insecure-pull
                      - --registry-mirror=mirror-dockerhub.registry.svc.cluster.local:5000
                      - --build-arg=NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/
                      - --build-arg=FRONTEND_PATH=shizuha-home
                      - --build-arg=PREV_FRONTEND_IMAGE=${PREV_FRONTEND_IMAGE}
                      - --cache=${CACHE_ENABLED}
                      - --cache-repo=${REG}/kaniko-cache/home-deploy-frontend-${ARCH}
                      - --cache-copy-layers=${CACHE_ENABLED}
                      - --cache-ttl=336h
                      - --compressed-caching=false
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          }

          BUILD_GUARD_CONFIGMAP="origin-ci-build-guard-650fec631781"
          BUILD_GUARD_SHA256="650fec631781edce0e4980f0fb07b12ab78b67b1faf780b214d12a40f9dddcf6"
          BUILD_GUARD="${RUNNER_TEMP:-/tmp}/origin-ci-build-guard.py"
          kubectl get "configmap/${BUILD_GUARD_CONFIGMAP}" -n origin \
            -o jsonpath='{.data.guard\.py}' >"$BUILD_GUARD"
          echo "${BUILD_GUARD_SHA256}  ${BUILD_GUARD}" | sha256sum -c -
          cleanup_build_attempts() {
            python3 "$BUILD_GUARD" cleanup --namespace build \
              --job "ci-build-home-frontend-${SHORT}-amd64-try1" \
              --job "ci-build-home-frontend-${SHORT}-amd64-try2" \
              --job "ci-build-home-frontend-${SHORT}-arm64-try1" \
              --job "ci-build-home-frontend-${SHORT}-arm64-try2"
          }
          cleanup_on_failure() {
            rc=$?
            if [ "$rc" -ne 0 ]; then cleanup_build_attempts || true; fi
            exit "$rc"
          }
          trap cleanup_on_failure EXIT INT TERM
          python3 "$BUILD_GUARD" preflight --arch amd64 --arch arm64
          cleanup_build_attempts

          wait_job() {
            local ARCH="$1"
            local ATTEMPT="$2"
            local JOB="ci-build-home-frontend-${SHORT}-${ARCH}-try${ATTEMPT}"
            local GUARD_LOG="/tmp/home-frontend-${ARCH}-try${ATTEMPT}-guard.log"
            local WAIT_RC=0
            python3 "$BUILD_GUARD" wait-jobs --namespace build \
              --job "${ARCH}=${JOB}" --timeout-seconds 1800 \
              --preserve-failed-jobs 2> >(tee "$GUARD_LOG" >&2) || WAIT_RC=$?
            if [ "$WAIT_RC" -eq 0 ]; then return 0; fi
            if grep -Fq 'SHIZUHA_BUILD_SCHEDULING_REASON' "$GUARD_LOG"; then
              return 70
            fi
            return "$WAIT_RC"
          }

          build_arch() {
            local ARCH="$1"
            local FIRST_LOG="/tmp/home-frontend-${ARCH}-try1.log"
            local RETRY_LOG="/tmp/home-frontend-${ARCH}-try2.log"

            # Apply is intentional: an operator can safely redispatch the exact
            # SHA while a terminal try1 Job is still inside its TTL window.
            render_build_job "${ARCH}" 1 true | kubectl apply -f -
            local WAIT_RC=0
            wait_job "${ARCH}" 1 || WAIT_RC=$?
            if [ "$WAIT_RC" -eq 0 ]; then return 0; fi
            if [ "$WAIT_RC" -eq 70 ]; then return "$WAIT_RC"; fi

            kubectl logs -n build "job/ci-build-home-frontend-${SHORT}-${ARCH}-try1" \
              --all-containers --tail=200 >"${FIRST_LOG}" 2>&1 || true
            if ! grep -Eq 'failed to get filesystem from image: unexpected EOF|npm error code ETIMEDOUT|npm error network|ETIMEDOUT' "${FIRST_LOG}"; then
              echo "::error::kaniko frontend ${ARCH} build failed with a non-retryable error"
              cat "${FIRST_LOG}"
              return 1
            fi

            echo "::warning::kaniko frontend ${ARCH} hit a transient cache/network error; retrying once with cache disabled"
            cat "${FIRST_LOG}"
            render_build_job "${ARCH}" 2 false | kubectl apply -f -
            WAIT_RC=0
            wait_job "${ARCH}" 2 || WAIT_RC=$?
            if [ "$WAIT_RC" -eq 0 ]; then return 0; fi
            if [ "$WAIT_RC" -eq 70 ]; then return "$WAIT_RC"; fi

            kubectl logs -n build "job/ci-build-home-frontend-${SHORT}-${ARCH}-try2" \
              --all-containers --tail=200 >"${RETRY_LOG}" 2>&1 || true
            echo "::error::kaniko frontend ${ARCH} cache-disabled retry failed"
            cat "${RETRY_LOG}"
            return 1
          }

          build_arch amd64 &
          WAIT_AMD64_PID=$!
          build_arch arm64 &
          WAIT_ARM64_PID=$!
          WAIT_FAILED=0
          wait "${WAIT_AMD64_PID}" || WAIT_FAILED=1
          wait "${WAIT_ARM64_PID}" || WAIT_FAILED=1
          if [ "${WAIT_FAILED}" -ne 0 ]; then
            exit 1
          fi
          trap - EXIT INT TERM

          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-manifest-home-frontend-${SHORT}
            namespace: build
            labels: { app: ci-manifest, service: home-frontend }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: crane
                    image: gcr.io/go-containerregistry/crane:latest
                    args:
                      - index
                      - append
                      - --insecure
                      - -t
                      - ${REG}/shizuha-home-frontend:${FTAG}
                      - -m
                      - ${REG}/shizuha-home-frontend:${FTAG}-amd64
                      - -m
                      - ${REG}/shizuha-home-frontend:${FTAG}-arm64
          YAML
          kubectl wait -n build --for=condition=complete "job/ci-manifest-home-frontend-${SHORT}" --timeout=300s || {
            echo "::error::frontend manifest combine failed"
            kubectl logs -n build "job/ci-manifest-home-frontend-${SHORT}" --tail=80 || true
            exit 1
          }

          set +e
          .forgejo/scripts/monotonic-release-guard.sh shizuha shizuha-home-frontend "${{ github.sha }}"
          GUARD_RC="$?"
          set -e
          if [ "${GUARD_RC}" = 10 ]; then exit 0; fi
          if [ "${GUARD_RC}" != 0 ]; then exit "${GUARD_RC}"; fi
          # Re-assert loop (PLAT-4123/HIVE-708): the deploy chart reconciler
          # (separate repository/concurrency group) snapshots the LIVE frontend
          # tag for its helm --set — if it snapshots BEFORE we roll and applies
          # DURING our rollout, it reverts us to the previous tag. helm applies
          # once and never re-touches the FE, so re-asserting converges; only a
          # persistent fighter still fails the run.
          dump_frontend_state() {
            # PLAT-6251: capture which assertion failed — deployment conditions,
            # observed generation, replica counts, and recent events.
            echo "--- deployment state ---"
            kubectl -n shizuha get deploy shizuha-home-frontend -o jsonpath='{.metadata.name}{"\n"}observedGeneration={.status.observedGeneration} generation={.metadata.generation}{"\n"}replicas={.status.replicas} ready={.status.readyReplicas} available={.status.availableReplicas} updated={.status.updatedReplicas}{"\n"}{range .status.conditions[*]}condition={.type} status={.status} reason={.reason} message={.message}{"\n"}{end}' || true
            echo "--- frontend pods ---"
            kubectl -n shizuha get pods -l app.kubernetes.io/name=shizuha-home-frontend -o wide || true
            echo "--- recent deployment events ---"
            kubectl -n shizuha get events --field-selector involvedObject.name=shizuha-home-frontend --sort-by=.lastTimestamp | tail -20 || true
          }
          for attempt in 1 2 3; do
            kubectl set image -n shizuha deploy/shizuha-home-frontend frontend="localhost:30500/shizuha-home-frontend:${FTAG}"
            if ! kubectl rollout status -n shizuha deploy/shizuha-home-frontend --timeout=300s; then
              echo "::error::kubectl rollout status failed (attempt ${attempt}) — expected ${FTAG}"
              dump_frontend_state
              exit 1
            fi
            LIVE="$(kubectl get deploy -n shizuha shizuha-home-frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
            echo "Live frontend image (attempt ${attempt}): ${LIVE} (expected ${FTAG})"
            if echo "${LIVE}" | grep -q "${FTAG}"; then break; fi
            if [ "${attempt}" = 3 ]; then
              echo "::error::frontend image mismatch after ${attempt} attempts — expected ${FTAG}, live ${LIVE}"
              dump_frontend_state
              exit 1
            fi
            echo "Frontend image clobbered mid-rollout (likely concurrent backend helm apply) — re-asserting"
            sleep 10
          done
          kubectl get pods -n shizuha -l app.kubernetes.io/name=shizuha-home-frontend

          # FRG-34 live gate: nginx's directory canonicalization runs behind
          # ingress TLS termination. A bad absolute redirect therefore exposes
          # signup traffic over cleartext even though the entry URL was HTTPS.
          REDIRECT_HEADERS="$(mktemp)"
          REDIRECT_STATUS="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --header 'Cache-Control: no-cache' \
            --output /dev/null --dump-header "${REDIRECT_HEADERS}" \
            --write-out '%{http_code}' https://shizuha.com/forge)"
          case "${REDIRECT_STATUS}" in
            301|302|307|308) ;;
            *) echo "::error::/forge returned ${REDIRECT_STATUS}, expected a canonical redirect"; exit 1 ;;
          esac
          REDIRECT_LOCATION="$(awk 'tolower($1) == "location:" {gsub("\\r", "", $2); print $2; exit}' "${REDIRECT_HEADERS}")"
          case "${REDIRECT_LOCATION}" in
            /forge/|https://shizuha.com/forge/) ;;
            *) echo "::error::/forge emitted unsafe Location: ${REDIRECT_LOCATION:-<missing>}"; exit 1 ;;
          esac

          readarray -t FINAL_RESULT < <(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --location --proto-redir '=https' --max-redirs 3 \
            --output /dev/null --write-out '%{url_effective}\n%{http_code}\n' \
            https://shizuha.com/forge)
          test "${FINAL_RESULT[0]}" = 'https://shizuha.com/forge/' || {
            echo "::error::/forge redirect chain ended at ${FINAL_RESULT[0]}"; exit 1;
          }
          test "${FINAL_RESULT[1]}" = '200' || {
            echo "::error::/forge final HTTPS response was ${FINAL_RESULT[1]}"; exit 1;
          }
          echo "FRG-34 live redirect gate: ${REDIRECT_STATUS} ${REDIRECT_LOCATION} -> ${FINAL_RESULT[0]} (${FINAL_RESULT[1]})"

          # Public-page pageerror smoke. Curl 200 still ships an uncaught
          # TypeError in AuthProvider (5d91610): localStorage.getItem is null
          # when logged out, and DOM assertions stay green. Open the live
          # public routes with no JWT; any pageerror rolls the previous image
          # back and fails this job.
          SMOKE_JOB="ci-smoke-home-frontend-${SHORT}"
          echo "smoke cwd=${PWD} GITHUB_WORKSPACE=${GITHUB_WORKSPACE:-} HOME=${HOME:-}"
          SMOKE_SRC="$(find "${GITHUB_WORKSPACE:-.}" "${PWD}" -name publicPageerrorSmoke.mjs 2>/dev/null | head -1)"
          echo "SMOKE_SRC=${SMOKE_SRC}"
          if [ -z "${SMOKE_SRC}" ] || [ ! -f "${SMOKE_SRC}" ]; then
            echo "::error::publicPageerrorSmoke.mjs not in checkout"
            ls -la "${GITHUB_WORKSPACE:-.}" "${PWD}" || true
            ls -la frontend/scripts || true
            exit 1
          fi
          kubectl delete job -n build "${SMOKE_JOB}" --ignore-not-found
          kubectl delete configmap -n build "${SMOKE_JOB}" --ignore-not-found
          kubectl create configmap -n build "${SMOKE_JOB}" \
            --from-file=smoke.mjs="${SMOKE_SRC}"
          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ${SMOKE_JOB}
            namespace: build
            labels: { app: ci-smoke, service: home-frontend }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke
                    image: mcr.microsoft.com/playwright:v1.58.2-noble
                    command: ["/bin/bash", "-lc"]
                    args:
                      - |
                        set -euo pipefail
                        cd /tmp
                        npm i playwright-core@1.58.2 >/dev/null
                        CHROME="\$(ls /ms-playwright/chromium-*/chrome-linux64/chrome | head -1)"
                        test -n "\${CHROME}"
                        PLAYWRIGHT_CHROME="\${CHROME}" PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
                          NODE_PATH=/tmp/node_modules \
                          PUBLIC_BASE=https://shizuha.com \
                          PUBLIC_PATHS='/, /dojo, /forge/, /research, /docs' \
                          node /smoke/smoke.mjs
                    volumeMounts: [{ mountPath: /smoke, name: smoke, readOnly: true }]
                volumes:
                  - name: smoke
                    configMap: { name: ${SMOKE_JOB} }
          YAML
          SMOKE_DEADLINE=$(( $(date +%s) + 240 ))
          SMOKE_OK=0
          while true; do
            COMPLETE="$(kubectl get job -n build "${SMOKE_JOB}" -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || true)"
            FAILED="$(kubectl get job -n build "${SMOKE_JOB}" -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || true)"
            if [ "${COMPLETE}" = "True" ]; then SMOKE_OK=1; break; fi
            if [ "${FAILED}" = "True" ] || [ "$(date +%s)" -ge "${SMOKE_DEADLINE}" ]; then break; fi
            sleep 5
          done
          if [ "${SMOKE_OK}" != "1" ]; then
            echo "::error::public pageerror smoke failed — rolling back to ${PREV_ROLL_IMAGE}"
            kubectl logs -n build "job/${SMOKE_JOB}" --tail=80 || true
            if [ -n "${PREV_ROLL_IMAGE}" ]; then
              kubectl set image -n shizuha deploy/shizuha-home-frontend frontend="${PREV_ROLL_IMAGE}"
              kubectl rollout status -n shizuha deploy/shizuha-home-frontend --timeout=180s || true
            fi
            exit 1
          fi
          kubectl logs -n build "job/${SMOKE_JOB}" --tail=40 || true
          kubectl annotate -n shizuha deploy/shizuha-home-frontend shizuha.io/last-successful-sha="${{ github.sha }}" --overwrite

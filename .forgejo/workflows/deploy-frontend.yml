# Shizuha Origin CI/CD — MULTI-ARCH build + deploy shizuha-home-FRONTEND.
# shizuha-home is frontend-only (no backend image) and root-mounted at /, so the
# default VITE base path is correct and no VITE_BASE_PATH build-arg is needed.
#
# BUILD CONTEXT IS THE MONOREPO, NOT THIS REPO: Dockerfile.prod copies
# packages/shizuha-ui and packages/shizuha-chat from the shizuha-stack monorepo
# root (they are tracked there, not published standalone), so the clone step
# assembles monorepo + this repo checked out at the triggering SHA. This mirrors
# deploy/k3s/scripts/build-multiarch.sh (FRONTEND_PATH=shizuha-home, root
# Dockerfile.prod) — the manual path used for the 2026-07-02 cache-control fix
# because home previously had NO Origin CI at all.
name: deploy-shizuha-home-frontend
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
  pull_request:
    paths:
      - .forgejo/workflows/deploy-frontend.yml
      - .forgejo/scripts/test-deploy-frontend-kaniko-retry.py
concurrency:
  group: deploy-shizuha-home-frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact-ref and bounded Kaniko recovery contract
        run: python3 .forgejo/scripts/test-deploy-frontend-kaniko-retry.py

  build-and-deploy:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering revision for monotonic release guard
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install kubectl + cluster access
        run: |
          set -euo pipefail
          KUBECTL_ARCH=$(uname -m); case "$KUBECTL_ARCH" in x86_64) KUBECTL_ARCH=amd64;; aarch64) KUBECTL_ARCH=arm64;; esac
          curl -fsSL -o kubectl "http://forgejo-http.origin.svc.cluster.local/api/packages/actions/generic/kubectl/v1.34.1/kubectl-${KUBECTL_ARCH}"
          install -m 0755 kubectl /usr/local/bin/kubectl
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Multi-arch build + deploy + verify (frontend)
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ github.sha }}" | cut -c1-7)"
          FTAG="home-frontend-${SHORT}"
          REG="registry.registry.svc.cluster.local:5000"
          echo "Multi-arch build shizuha-home-frontend:${FTAG} (amd64 + arm64)"
          PREV_FRONTEND_IMAGE="$(kubectl -n shizuha get deploy shizuha-home-frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
          # The live deployment references the registry via the node-local localhost:30500
          # host, which is NOT reachable from inside the kaniko build pod (its own loopback).
          # Normalize to the in-cluster registry service so kaniko can pull the previous
          # image to carry forward the hashed CSS/JS assets.
          PREV_FRONTEND_IMAGE="${PREV_FRONTEND_IMAGE//localhost:30500/${REG}}"
          echo "Carry forward hashed assets from ${PREV_FRONTEND_IMAGE}"

          render_build_job() {  # $1=arch $2=attempt $3=cache-enabled
            local ARCH="$1"
            local ATTEMPT="$2"
            local CACHE_ENABLED="$3"
            cat <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-build-home-frontend-${SHORT}-${ARCH}-try${ATTEMPT}
            namespace: build
            labels:
              app: ci-build
              service: home-frontend
              attempt: "${ATTEMPT}"
              cache-enabled: "${CACHE_ENABLED}"
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                nodeSelector: { kubernetes.io/arch: ${ARCH} }
                tolerations:
                  - { key: node.shizuha/workstation, operator: Exists, effect: NoSchedule }
                  - { key: shizuha.com/inference-paused, operator: Exists, effect: NoSchedule }
                affinity:
                  nodeAffinity:
                    requiredDuringSchedulingIgnoredDuringExecution:
                      nodeSelectorTerms:
                      - matchExpressions:
                        - { key: node-role.kubernetes.io/control-plane, operator: DoesNotExist }
                initContainers:
                  - name: git-clone
                    image: alpine/git:2.43.0
                    command: ["/bin/sh","-c"]
                    args:
                      - |
                        set -e
                        # Monorepo root for packages/ (shallow; submodule pointers only)
                        git clone --depth=1 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/shizuha-stack.git /workspace/src
                        # Replace the shizuha-home submodule pointer with THIS repo at the pushed SHA
                        rm -rf /workspace/src/shizuha-home
                        git clone --depth=50 http://x-token-auth:\${GIT_PASSWORD}@forgejo-http.origin.svc.cluster.local/shizuha-labs/home.git /workspace/src/shizuha-home
                        cd /workspace/src/shizuha-home
                        if ! git checkout --detach ${{ github.sha }}; then
                          git fetch --depth=1 origin ${{ github.sha }}
                          git checkout --detach ${{ github.sha }}
                        fi
                        test "\$(git rev-parse HEAD)" = "${{ github.sha }}"
                    env:
                      - name: GIT_PASSWORD
                        valueFrom: { secretKeyRef: { name: forgejo-token, key: password } }
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                containers:
                  - name: kaniko
                    image: gcr.io/kaniko-project/executor:v1.23.2
                    args:
                      - --context=dir:///workspace/src
                      - --dockerfile=/workspace/src/shizuha-home/Dockerfile.prod
                      - --destination=${REG}/shizuha-home-frontend:${FTAG}-${ARCH}
                      - --cleanup
                      - --insecure
                      - --skip-tls-verify
                      - --insecure-pull
                      - --registry-mirror=mirror-dockerhub.registry.svc.cluster.local:5000
                      - --build-arg=NPM_CONFIG_REGISTRY=http://npm-cache.registry.svc.cluster.local:4873/
                      - --build-arg=FRONTEND_PATH=shizuha-home
                      - --build-arg=PREV_FRONTEND_IMAGE=${PREV_FRONTEND_IMAGE}
                      - --cache=${CACHE_ENABLED}
                      - --cache-repo=${REG}/kaniko-cache/home-deploy-frontend-${ARCH}
                      - --cache-copy-layers=${CACHE_ENABLED}
                      - --cache-ttl=336h
                      - --compressed-caching=false
                    volumeMounts: [{ mountPath: /workspace, name: workspace }]
                volumes: [{ emptyDir: {}, name: workspace }]
          YAML
          }

          wait_job() {
            local ARCH="$1"
            local ATTEMPT="$2"
            local JOB="ci-build-home-frontend-${SHORT}-${ARCH}-try${ATTEMPT}"
            local POLL
            for POLL in $(seq 1 360); do
              if kubectl get "job/${JOB}" -n build -o jsonpath='{.status.succeeded}' | grep -q '[1-9]'; then
                return 0
              fi
              if kubectl get "job/${JOB}" -n build -o jsonpath='{.status.failed}' | grep -q '[1-9]'; then
                return 1
              fi
              sleep 5
            done
            echo "::error::kaniko frontend ${ARCH} try ${ATTEMPT} timed out after 1800s"
            return 1
          }

          build_arch() {
            local ARCH="$1"
            local FIRST_LOG="/tmp/home-frontend-${ARCH}-try1.log"
            local RETRY_LOG="/tmp/home-frontend-${ARCH}-try2.log"

            # Apply is intentional: an operator can safely redispatch the exact
            # SHA while a terminal try1 Job is still inside its TTL window.
            render_build_job "${ARCH}" 1 true | kubectl apply -f -
            if wait_job "${ARCH}" 1; then
              return 0
            fi

            kubectl logs -n build "job/ci-build-home-frontend-${SHORT}-${ARCH}-try1" \
              --all-containers --tail=200 >"${FIRST_LOG}" 2>&1 || true
            if ! grep -Eq 'failed to get filesystem from image: unexpected EOF|npm error code ETIMEDOUT|npm error network|ETIMEDOUT' "${FIRST_LOG}"; then
              echo "::error::kaniko frontend ${ARCH} build failed with a non-retryable error"
              cat "${FIRST_LOG}"
              return 1
            fi

            echo "::warning::kaniko frontend ${ARCH} hit a transient cache/network error; retrying once with cache disabled"
            cat "${FIRST_LOG}"
            render_build_job "${ARCH}" 2 false | kubectl apply -f -
            if wait_job "${ARCH}" 2; then
              return 0
            fi

            kubectl logs -n build "job/ci-build-home-frontend-${SHORT}-${ARCH}-try2" \
              --all-containers --tail=200 >"${RETRY_LOG}" 2>&1 || true
            echo "::error::kaniko frontend ${ARCH} cache-disabled retry failed"
            cat "${RETRY_LOG}"
            return 1
          }

          build_arch amd64 &
          WAIT_AMD64_PID=$!
          build_arch arm64 &
          WAIT_ARM64_PID=$!
          WAIT_FAILED=0
          wait "${WAIT_AMD64_PID}" || WAIT_FAILED=1
          wait "${WAIT_ARM64_PID}" || WAIT_FAILED=1
          if [ "${WAIT_FAILED}" -ne 0 ]; then
            exit 1
          fi

          cat <<YAML | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: ci-manifest-home-frontend-${SHORT}
            namespace: build
            labels: { app: ci-manifest, service: home-frontend }
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: crane
                    image: gcr.io/go-containerregistry/crane:latest
                    args:
                      - index
                      - append
                      - --insecure
                      - -t
                      - ${REG}/shizuha-home-frontend:${FTAG}
                      - -m
                      - ${REG}/shizuha-home-frontend:${FTAG}-amd64
                      - -m
                      - ${REG}/shizuha-home-frontend:${FTAG}-arm64
          YAML
          kubectl wait -n build --for=condition=complete "job/ci-manifest-home-frontend-${SHORT}" --timeout=300s || {
            echo "::error::frontend manifest combine failed"
            kubectl logs -n build "job/ci-manifest-home-frontend-${SHORT}" --tail=80 || true
            exit 1
          }

          set +e
          .forgejo/scripts/monotonic-release-guard.sh shizuha shizuha-home-frontend "${{ github.sha }}"
          GUARD_RC="$?"
          set -e
          if [ "${GUARD_RC}" = 10 ]; then exit 0; fi
          if [ "${GUARD_RC}" != 0 ]; then exit "${GUARD_RC}"; fi
          # Re-assert loop (PLAT-4123/HIVE-708): the deploy chart reconciler
          # (separate repository/concurrency group) snapshots the LIVE frontend
          # tag for its helm --set — if it snapshots BEFORE we roll and applies
          # DURING our rollout, it reverts us to the previous tag. helm applies
          # once and never re-touches the FE, so re-asserting converges; only a
          # persistent fighter still fails the run.
          dump_frontend_state() {
            # PLAT-6251: capture which assertion failed — deployment conditions,
            # observed generation, replica counts, and recent events.
            echo "--- deployment state ---"
            kubectl -n shizuha get deploy shizuha-home-frontend -o jsonpath='{.metadata.name}{"\n"}observedGeneration={.status.observedGeneration} generation={.metadata.generation}{"\n"}replicas={.status.replicas} ready={.status.readyReplicas} available={.status.availableReplicas} updated={.status.updatedReplicas}{"\n"}{range .status.conditions[*]}condition={.type} status={.status} reason={.reason} message={.message}{"\n"}{end}' || true
            echo "--- frontend pods ---"
            kubectl -n shizuha get pods -l app.kubernetes.io/name=shizuha-home-frontend -o wide || true
            echo "--- recent deployment events ---"
            kubectl -n shizuha get events --field-selector involvedObject.name=shizuha-home-frontend --sort-by=.lastTimestamp | tail -20 || true
          }
          for attempt in 1 2 3; do
            kubectl set image -n shizuha deploy/shizuha-home-frontend frontend="localhost:30500/shizuha-home-frontend:${FTAG}"
            if ! kubectl rollout status -n shizuha deploy/shizuha-home-frontend --timeout=300s; then
              echo "::error::kubectl rollout status failed (attempt ${attempt}) — expected ${FTAG}"
              dump_frontend_state
              exit 1
            fi
            LIVE="$(kubectl get deploy -n shizuha shizuha-home-frontend -o jsonpath='{.spec.template.spec.containers[0].image}')"
            echo "Live frontend image (attempt ${attempt}): ${LIVE} (expected ${FTAG})"
            if echo "${LIVE}" | grep -q "${FTAG}"; then break; fi
            if [ "${attempt}" = 3 ]; then
              echo "::error::frontend image mismatch after ${attempt} attempts — expected ${FTAG}, live ${LIVE}"
              dump_frontend_state
              exit 1
            fi
            echo "Frontend image clobbered mid-rollout (likely concurrent backend helm apply) — re-asserting"
            sleep 10
          done
          kubectl annotate -n shizuha deploy/shizuha-home-frontend shizuha.io/last-successful-sha="${{ github.sha }}" --overwrite
          kubectl get pods -n shizuha -l app.kubernetes.io/name=shizuha-home-frontend

          # FRG-34 live gate: nginx's directory canonicalization runs behind
          # ingress TLS termination. A bad absolute redirect therefore exposes
          # signup traffic over cleartext even though the entry URL was HTTPS.
          REDIRECT_HEADERS="$(mktemp)"
          REDIRECT_STATUS="$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --header 'Cache-Control: no-cache' \
            --output /dev/null --dump-header "${REDIRECT_HEADERS}" \
            --write-out '%{http_code}' https://shizuha.com/forge)"
          case "${REDIRECT_STATUS}" in
            301|302|307|308) ;;
            *) echo "::error::/forge returned ${REDIRECT_STATUS}, expected a canonical redirect"; exit 1 ;;
          esac
          REDIRECT_LOCATION="$(awk 'tolower($1) == "location:" {gsub("\\r", "", $2); print $2; exit}' "${REDIRECT_HEADERS}")"
          case "${REDIRECT_LOCATION}" in
            /forge/|https://shizuha.com/forge/) ;;
            *) echo "::error::/forge emitted unsafe Location: ${REDIRECT_LOCATION:-<missing>}"; exit 1 ;;
          esac

          readarray -t FINAL_RESULT < <(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --location --proto-redir '=https' --max-redirs 3 \
            --output /dev/null --write-out '%{url_effective}\n%{http_code}\n' \
            https://shizuha.com/forge)
          test "${FINAL_RESULT[0]}" = 'https://shizuha.com/forge/' || {
            echo "::error::/forge redirect chain ended at ${FINAL_RESULT[0]}"; exit 1;
          }
          test "${FINAL_RESULT[1]}" = '200' || {
            echo "::error::/forge final HTTPS response was ${FINAL_RESULT[1]}"; exit 1;
          }
          echo "FRG-34 live redirect gate: ${REDIRECT_STATUS} ${REDIRECT_LOCATION} -> ${FINAL_RESULT[0]} (${FINAL_RESULT[1]})"
